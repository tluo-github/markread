[package]
name = "markread"
version = "0.1.2"
description = "MarkRead — Minimal, free & offline Markdown reader inspired by Typora"
authors = ["MarkRead"]
edition = "2021"

[lib]
name = "markread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
percent-encoding = "2"
mime_guess = "2"
